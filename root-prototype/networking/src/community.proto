syntax = "proto3";

import "rootsdk/types.proto";

enum MadameCommunityContext {
  MADAME_COMMUNITY_CONTEXT_UNSPECIFIED = 0;
  MADAME_COMMUNITY_CONTEXT_GENERAL = 1;
  MADAME_COMMUNITY_CONTEXT_COMMUNITY = 2;
  MADAME_COMMUNITY_CONTEXT_BALLET = 3;
  MADAME_COMMUNITY_CONTEXT_FASHION = 4;
  MADAME_COMMUNITY_CONTEXT_LUXURY = 5;
  MADAME_COMMUNITY_CONTEXT_SYSTEM = 6;
}

enum MadameCommunitySignal {
  MADAME_COMMUNITY_SIGNAL_UNSPECIFIED = 0;
  MADAME_COMMUNITY_SIGNAL_GREETING = 1;
  MADAME_COMMUNITY_SIGNAL_HELP = 2;
  MADAME_COMMUNITY_SIGNAL_STATUS = 3;
  MADAME_COMMUNITY_SIGNAL_CASUAL = 4;
  MADAME_COMMUNITY_SIGNAL_PREPARATION = 5;
  MADAME_COMMUNITY_SIGNAL_SUCCESS = 6;
  MADAME_COMMUNITY_SIGNAL_FAILURE = 7;
  MADAME_COMMUNITY_SIGNAL_REPEATED_FAILURE = 8;
  MADAME_COMMUNITY_SIGNAL_ENCOURAGEMENT = 9;
  MADAME_COMMUNITY_SIGNAL_WARNING = 10;
  MADAME_COMMUNITY_SIGNAL_CORRECTIVE_TASK = 11;
  MADAME_COMMUNITY_SIGNAL_CONFUSION = 12;
  MADAME_COMMUNITY_SIGNAL_RECOVERY = 13;
  MADAME_COMMUNITY_SIGNAL_STAMINA = 14;
  MADAME_COMMUNITY_SIGNAL_READINESS = 15;
  MADAME_COMMUNITY_SIGNAL_FASHION = 16;
  MADAME_COMMUNITY_SIGNAL_LUXURY_CHOICE = 17;
  MADAME_COMMUNITY_SIGNAL_SYSTEM_ERROR = 18;
  MADAME_COMMUNITY_SIGNAL_COMMUNITY_REPLY = 19;
}

message MadameCommunityEvent {
  string message = 1;
  string mood = 2;
  MadameCommunityContext context = 3;
  MadameCommunitySignal signal = 4;
}

service MadameCommunityService {
  rpc BroadcastCreated(MadameCommunityEvent) returns (rootsdk.Void);
}
